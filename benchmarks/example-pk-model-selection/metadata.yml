name: example-pk-model-selection
title: PK Model Selection Submission Format Example
version: 1.0.0
date: 2025-10-16
goal: generic
status: format_example
authors:
  - name: Pharmacometrics Benchmarks contributors
description: Small illustrative CSV snippets and task definitions; not a validated scientific benchmark
keywords:
  - pharmacokinetics
  - model-selection
  - two-compartment
  - synthetic-data
  - covariates
data_type: synthetic
therapeutic_area: general
n_subjects: 2
n_subjects_train: 1
n_subjects_test: 1
n_observations: 6
n_observations_train: 3
n_observations_test: 3
tasks:
  - name: structural-model-selection
    type: classification
    description: Identify the correct structural model from {1cmt, 2cmt, 3cmt}
    output_format: {type: class_predictions, columns: [MODEL_SELECTED]}
    metric: accuracy

  - name: covariate-model-selection
    type: classification
    description: Identify which covariates have true effects on CL and Vc
    output_format: {type: class_predictions, columns: [COVARIATE, SELECTED]}
    metric: f1

  - name: prediction-accuracy
    type: regression
    description: Predict plasma concentrations in the test set
    target: DV
    output_format: {type: individual_predictions, columns: [ID, TIME, PRED]}
    metric: rmse
license: MIT
doi: null  # No DOI: submission format example
